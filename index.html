<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa Nova da Vi</title>
<meta name="theme-color" content="#f5f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa Nova da Vi">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a quiet floor-plan index of four rooms; tap one to open its shopping list. */
:root{
  --bg:#f5f5f1; --surface:#ffffff; --ink:#1d1e1b; --muted:#73766c; --line:#dfe0d8;
  --accent:#4d5a3b; --accent-soft:#e7eadf; --done:#a3a69a; --danger:#9a3b2e;
  --display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161714; --surface:#1f201c; --ink:#ecebe4; --muted:#9a9d91; --line:#33352f;
  --accent:#b4c296; --accent-soft:#2a2f22; --done:#6b6e64; --danger:#e08d7e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161714; --surface:#1f201c; --ink:#ecebe4; --muted:#9a9d91; --line:#33352f;
  --accent:#b4c296; --accent-soft:#2a2f22; --done:#6b6e64; --danger:#e08d7e; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.05}
h2{font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.1}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* summary */
.summary{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:16px}
.budget{display:flex;flex-direction:column;gap:6px}
.budget .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.budget-btn{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:10px;font-family:var(--display);font-size:clamp(2rem,9vw,2.6rem);line-height:1.1}
.budget-btn small{font-family:var(--body);font-size:.78rem;color:var(--accent);font-weight:600}
.budget-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form.budget-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.budget-form input{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:10px 12px;font-size:16px;width:12ch;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline}
.stats div{display:flex;flex-direction:column}
.over{color:var(--danger)!important}
.bar i.over-bar{background:var(--danger)}
.stats strong{font-family:var(--display);font-weight:400;font-size:1.5rem}
.stats span{font-size:.8rem;color:var(--muted)}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.room{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:18px;display:flex;flex-direction:column;gap:14px;min-height:190px;transition:border-color .2s,transform .2s}
.room:hover{border-color:var(--accent)}
.room:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.room svg{width:44px;height:44px;stroke:var(--ink);fill:none;stroke-width:1.2}
.room .name{font-family:var(--display);font-size:1.35rem;line-height:1.15}
.room .meta{font-size:.8rem;color:var(--muted);margin-top:auto;display:flex;flex-direction:column;gap:8px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* detail */
.back{all:unset;cursor:pointer;font-size:.85rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.dhead{display:flex;flex-direction:column;gap:10px}
.dstats{display:flex;gap:20px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.dstats b{color:var(--ink);font-weight:600}

form.add{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:4px;padding:8px}
form.add input,form.add select{border:0;background:transparent;padding:10px 8px;min-width:0}
form.add input:focus,form.add select:focus{outline:none;background:var(--accent-soft);border-radius:3px}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--bg);padding:10px 16px;border-radius:3px;
  font-weight:600;font-size:.85rem;text-align:center}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:.8rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.group{display:flex;flex-direction:column}
.group h3{margin:0 0 4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
ul.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li.item{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 34px;gap:12px;align-items:center;padding:14px 2px}
.plus{all:unset;cursor:pointer;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;
  color:var(--accent);font-size:1.15rem;line-height:1;transition:background .2s,transform .2s}
.plus:hover{background:var(--accent-soft)}
.plus[aria-expanded="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent);transform:rotate(45deg)}
.plus:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shop{display:flex;flex-direction:column;gap:14px;padding:0 2px 14px 40px}
li.item > .opts{padding:0 2px 16px 40px}
form.add .addess{grid-column:1/-1;padding:4px 8px 6px}
.shopfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.switch{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-size:.88rem;color:var(--ink)}
.switch .knob{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"] .knob{background:var(--accent)}
.switch[aria-checked="true"] .knob::after{transform:translateX(16px)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px 14px;align-items:start;background:var(--surface);
  border:1px solid var(--line);border-radius:4px;padding:12px}
.opt.chosen{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.thumb{width:84px;height:84px;border-radius:3px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;cursor:pointer}
span.thumb{cursor:default}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .ph{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.68rem}
.thumb:has(.ph){background:var(--accent-soft);border-style:dashed}
.oinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .src{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600}
.opt .brand{color:var(--muted)}
.opt .ttl{font-size:.88rem;line-height:1.35;overflow-wrap:anywhere}
.opt .ttl a{color:inherit;text-decoration:none}
.opt .ttl a:hover{text-decoration:underline}
.opt .pr{font-family:var(--display);font-size:1.3rem;margin-top:2px}
.opt .pnote{font-size:.74rem;color:var(--muted)}
.opt .acts{grid-column:1/-1;display:flex;gap:16px;align-items:center;font-size:.8rem;border-top:1px solid var(--line);padding-top:10px}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:.8rem}
.lnk.muted{color:var(--muted);font-weight:500}
.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{font-size:.8rem;color:var(--accent);font-weight:600}
form.optform{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
form.optform input{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:10px;min-width:0;font-size:.88rem}
form.optedit{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
form.optedit label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;color:var(--muted)}
form.optedit .full{grid-column:1/-1}
form.optedit input{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:8px 10px;min-width:0;font-size:.88rem}
form.optedit .acts{display:flex;gap:8px;border:0;padding:0}
.check{appearance:none;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:50%;margin:0;cursor:pointer;display:grid;place-items:center}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.iname{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.iname .t{overflow-wrap:anywhere}
.iname .s{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600}
.price{font-size:.9rem;text-align:right;white-space:nowrap}
.price.empty{color:var(--muted)}
li.done .t{text-decoration:line-through;color:var(--done)}
li.done .price{color:var(--done)}

.edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 2px 16px 40px}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted)}
.edit label.full{grid-column:1/-1}
.edit input,.edit select,.edit textarea{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:8px 10px;min-width:0;font-size:.9rem}
.edit textarea{resize:vertical;min-height:56px}
.edit .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.edit .actions .spacer{flex:1}
a.link{color:var(--accent);font-size:.78rem;overflow-wrap:anywhere}

.empty-state{color:var(--muted);font-size:.9rem;padding:18px 0}
.note{font-size:.8rem;color:var(--muted)}

.auth{display:flex;flex-direction:column;gap:14px;max-width:380px}
.auth input{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:12px;font-size:16px;min-width:0}
.auth .row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.auth .msg{font-size:.85rem;color:var(--muted);min-height:1.2em;margin:0}
.auth .msg.err{color:var(--danger)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
input,select,textarea{font-size:16px}
@media (max-width:460px){

  .edit{padding-left:0;grid-template-columns:minmax(0,1fr)}
  .shop{padding-left:0}
  li.item > .opts{padding-left:0}
  .row{gap:10px}
  .room{min-height:170px;padding:16px}
}
.dgrid{display:flex;flex-direction:column;gap:22px}
.dside{display:flex;flex-direction:column;gap:22px;min-width:0}
.roomnav{display:none}
.hometop{display:flex;flex-direction:column;gap:22px}

/* Computador: paisagem, ocupa a tela toda */
@media (min-width:1024px){
  .wrap{max-width:1560px;padding-block:40px 64px}
  .hometop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:48px;align-items:end}
  .hometop .summary{border-top:0;padding-top:0}
  .hometop h1{font-size:clamp(3rem,4.6vw,4.4rem)}
  .rooms{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .room{min-height:clamp(260px,calc(100vh - 420px),520px);padding:28px}
  .room svg{width:56px;height:56px}
  .room .name{font-size:1.6rem}

  .dgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:48px;align-items:start}
  .dside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);max-height:calc(100vh - 48px);overflow:auto;padding-bottom:8px}
  form.add{grid-template-columns:minmax(0,1fr) auto}
  .roomnav{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .roomnav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:.92rem;color:var(--muted)}
  .roomnav button:hover{color:var(--ink)}
  .roomnav button[aria-current="true"]{color:var(--ink);font-weight:600}
  .roomnav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  ul.items{border-top:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start}
  li.item{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 16px 4px}
  li.item > .opts, .shop, .edit{padding-left:0}
  .opt{grid-template-columns:96px minmax(0,1fr);background:var(--bg)}
  .thumb{width:96px;height:96px}
  .group h3{margin-bottom:10px}
}
@media (min-width:1600px){ ul.items{grid-template-columns:repeat(3,minmax(0,1fr))} }

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section id="auth" hidden>
    <div style="display:flex;flex-direction:column;gap:22px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span class="eyebrow">Planejamento do apartamento</span>
        <h1>Casa Nova da Vi</h1>
      </div>
      <form class="auth" id="authForm" autocomplete="on">
        <input id="authEmail" type="email" placeholder="Seu e-mail" autocomplete="email" required aria-label="E-mail">
        <input id="authPass" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password" minlength="6" required aria-label="Senha">
        <div class="row2"><button class="btn" type="submit" id="btnLogin">Entrar</button>
          <button class="btn ghost" type="button" id="btnSignup">Criar conta</button></div>
        <p class="msg" id="authMsg" role="status"></p>
      </form>
    </div>
  </section>

  <section id="home" hidden>
    <div style="display:flex;flex-direction:column;gap:22px">
      <div class="hometop">
        <div style="display:flex;flex-direction:column;gap:8px">
          <span class="eyebrow">Planejamento do apartamento</span>
          <h1>Casa Nova da Vi</h1>
        </div>
        <div class="summary" id="summary"></div>
      </div>
      <div class="rooms" id="rooms"></div>
      <p class="note" id="status">Carregando sua lista…</p>
      <div class="foot"><span><span id="who"></span> · versão 14</span><button class="lnk muted" type="button" id="btnLogout">Sair</button></div>
    </div>
  </section>

  <section id="detail" hidden>
    <div class="dgrid">
     <aside class="dside">
      <button class="back" id="back" type="button">← Todos os cômodos</button>
      <div class="dhead">
        <span class="eyebrow" id="dEyebrow"></span>
        <h2 id="dTitle"></h2>
        <div class="dstats" id="dStats"></div>
        <div class="bar"><i id="dBar" style="width:0"></i></div>
      </div>
      <form class="add" id="addForm" autocomplete="off">
        <input id="addName" placeholder="Adicionar item…" aria-label="Nome do item" required>
        <button class="btn" type="submit">Adicionar</button>
        <button type="button" class="switch addess" role="switch" aria-checked="true" id="addEss"><span class="knob"></span>Essencial</button>
      </form>
      <div class="filters" id="filters">
        <button class="chip" type="button" data-f="all" aria-pressed="true">Tudo</button>
        <button class="chip" type="button" data-f="essencial" aria-pressed="false">Essenciais</button>
        <button class="chip" type="button" data-f="depois" aria-pressed="false">Pode esperar</button>
      </div>
      <nav class="roomnav" id="roomnav" aria-label="Cômodos"></nav>
     </aside>
      <div id="lists" style="display:flex;flex-direction:column;gap:26px;min-width:0"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const ROOMS = [
  {id:"cozinha", name:"Cozinha", icon:'<svg viewBox="0 0 44 44"><rect x="6" y="8" width="32" height="30"/><line x1="6" y1="18" x2="38" y2="18"/><circle cx="14" cy="13" r="2"/><circle cx="22" cy="13" r="2"/><rect x="12" y="23" width="20" height="10"/></svg>'},
  {id:"sala", name:"Sala de estar", icon:'<svg viewBox="0 0 44 44"><path d="M8 30V20a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v10"/><rect x="5" y="24" width="34" height="8"/><line x1="9" y1="32" x2="9" y2="36"/><line x1="35" y1="32" x2="35" y2="36"/></svg>'},
  {id:"quarto", name:"Quarto", icon:'<svg viewBox="0 0 44 44"><rect x="6" y="22" width="32" height="10"/><path d="M8 22V12h28v10"/><rect x="11" y="16" width="9" height="6"/><rect x="24" y="16" width="9" height="6"/><line x1="8" y1="32" x2="8" y2="36"/><line x1="36" y1="32" x2="36" y2="36"/></svg>'},
  {id:"banheiro", name:"Banheiro", icon:'<svg viewBox="0 0 44 44"><path d="M6 22h32v4a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z"/><path d="M10 22V10a3 3 0 0 1 6 0"/><line x1="14" y1="34" x2="12" y2="38"/><line x1="30" y1="34" x2="32" y2="38"/></svg>'}
];
const brl = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const fmt = v => (typeof v === "number" && isFinite(v)) ? brl.format(v) : "—";
const parsePrice = s => { s = String(s||"").replace(/[^\d,.-]/g,""); if(!s) return null;
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",","."); const n = parseFloat(s); return isFinite(n) ? n : null; };
const $ = id => document.getElementById(id);

let items = [];        // [{id, ...data}]
let db = null, col = null, budget = 15000, editingBudget = false;
let current = null, filter = "all", openEdit = null, openShop = null, openOpt = null, assets = null;

function stats(list){
  const total = list.reduce((a,i)=>a+(i.price||0),0);
  const spent = list.filter(i=>i.done).reduce((a,i)=>a+(i.price||0),0);
  const done = list.filter(i=>i.done).length;
  const reg = list.filter(i=>(i.options||[]).length > 0).length;
  return {count:list.length, done, reg, total, spent, left: total-spent};
}

function renderHome(){
  const s = stats(items);
  const free = budget - s.total, pct = budget > 0 ? Math.min(100, s.total / budget * 100) : 0;
  $("summary").innerHTML = `
    <div class="budget">
      <span class="lbl">Orçamento</span>
      ${editingBudget ? `<form class="budget-form" id="budgetForm" autocomplete="off">
          <input id="budgetInput" inputmode="decimal" class="num" value="${String(budget).replace(".",",")}" aria-label="Orçamento total em reais">
          <button class="btn" type="submit">Salvar</button><button class="btn ghost" type="button" data-budget-cancel>Cancelar</button></form>`

/* Lê a mensagem do botão "Compartilhar" das lojas: nome e preço vêm junto com o link. */
function parseShared(raw, url){
  const urls = raw.match(/https?:\/\/\S+/g) || [];
  let text = raw;
  for (const u of urls) text = text.split(u).join(" ");
  text = text.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{3030}\u{303D}]/gu, " ");
  // Preço: "Por: R$ 131,55" vence o "De:"; senão, o último R$ da mensagem.
  const num = "(\\d{1,3}(?:\\.\\d{3})*(?:,\\d{2})?|\\d+(?:,\\d{2})?)";
  const por = text.match(new RegExp("(?:por|agora|apenas|só)\\s*:?\\s*R\\$\\s?" + num, "i"));
  const all = [...text.matchAll(new RegExp("R\\$\\s?" + num, "g"))];
  const pick = por ? por[1] : (all.length ? all[all.length - 1][1] : null);
  const price = pick ? parsePrice(pick) : null;
  // Nome: a linha que descreve o produto, sem chamadas de promoção nem preço.
  const lines = text.split(/\n+/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const junk = /^(t[áa] no precinho|corre|promo|oferta|imperd[ií]vel|achadinho|olha|aproveita|compre aqui|link|cupom|frete|de:|por:)/i;
  let title = "";
  for (const l of lines){
    if (junk.test(l) || /R\$/.test(l) || /^[!?.,:;\-–\s]*$/.test(l) || l.length < 6) continue;
    if (/[a-zà-ú]/i.test(l) && (l.match(/[A-ZÀ-Ú]/g)||[]).length / l.replace(/[^a-zà-úA-ZÀ-Ú]/g,"").length > 0.8 && l.length < 40) continue; // linha só em maiúsculas
    title = l; break;
  }
  if (!title){
    let t = lines.join(" ");
    const m1 = t.match(/(?:confira|d[eê] uma olhada em|veja|olha o que encontrei[^:]*:)\s*[:\-]?\s*(.+?)(?:\s+(?:por|a partir de|só)\s+R\$|\s+na Shopee|\s+no Mercado Livre|$)/i);
    title = m1 ? m1[1] : t.replace(/\s*(?:(?:por|a partir de)\s+)?R\$.*$/i, "");
  }
  title = title.replace(/\s*(?:(?:por|a partir de)\s+)?R\$.*$/i, "")
    .replace(/\b(compre (?:na|no|aqui).*|baixe o app.*|na shopee.*|no mercado livre.*)$/i, "")
    .replace(/^(?:te recomendo(?: este produto)?|recomendo|achei|encontrei)[:\s-]*/i, "")
    .replace(/[!.:\-–|\s]+$/,"").trim();
  if (title.length < 4 || /^https?:/i.test(title)) title = "";
  return {title: title.slice(0, 160), price: price && price > 0 ? price : null};
}
/* Nome curto para a lista: até 4 palavras, sem códigos nem complementos. */
function shortName(full){
  let t = String(full||"").split(/\s[|–-]\s/)[0].replace(/\s*\(.*?\)\s*/g," ").trim();
  const stop = new Set(["para","com","de","do","da","dos","das","e","em","sem","cor","kit","-"]);
  const out = [];
  for (const w of t.split(/\s+/)){
    const lw = w.toLowerCase();
    if (/^[A-Z0-9]{5,}$/.test(w) && /\d/.test(w)) break; // código do modelo
    if (out.length >= 3 && stop.has(lw)) break;
    if (out.length && lw.slice(0,3) === out[out.length-1].toLowerCase().slice(0,3)) continue; // "Mesa Mesinha"
    out.push(w);
    if (out.length >= 4) break;
  }
  while (out.length > 1 && stop.has(out[out.length-1].toLowerCase())) out.pop();
  const s = out.map((w,i)=> /\d|^[A-Z]{2,}$/.test(w) ? w : (i===0 ? w.charAt(0).toUpperCase()+w.slice(1).toLowerCase() : w.toLowerCase())).join(" ");
  return s || full;
}

    await setOptions(it.id, s=>{ const x = s.options.find(y=>y.id===o.id); if(x){ x.photo = up.url; x.photoId = up.id; } return s; });
  }catch(err){ console.error(err); alertMsg("Não foi possível enviar a foto. Tente de novo."); }
});

$("lists").addEventListener("change", async e=>{
  const inp = e.target.closest("[data-photo]"); if(!inp || !inp.files || !inp.files[0] || !assets) return;

$("lists").addEventListener("submit", e=>{
  const rf = e.target.closest("[data-renameform]");
  if (rf){ e.preventDefault();
    const id = rf.dataset.renameform, name = String(new FormData(rf).get("name")||"").trim();
    const it = items.find(i=>i.id===id); if(!it || !name || name===it.name) return;
    write(()=>col.doc(id).update({name}), ()=>{ it.name = name; }); return; }
  const of = e.target.closest("[data-optform]");
  if (of){ e.preventDefault();
    const id = of.dataset.optform, raw = String(new FormData(of).get("link")||"").trim();

    const link = cleanLink(m[0]), shared = parseShared(raw, m[0]), title = shared.title || nameFromLink(link);
    const auto = !NO_AUTO.test(link) && shared.price == null;
    const opt = {id:"o"+Date.now().toString(36), store:storeFromLink(link), brand:brandFrom(title), title: title || "", fullTitle: title || "", price:shared.price, priceNote: shared.price!=null ? "preço da mensagem compartilhada" : "", photo:"", link, pending:auto, addedAt:Date.now()};
    lastOpt[id] = opt.id;
    setOptions(id, s=>{ s.options.unshift(opt); if(!s.chosenId || !s.options.some(x=>x.id===s.chosenId && x.id!==opt.id)){ s.chosenId=opt.id; s.link=link; s.price=opt.price; } return s; });
    enrich(id, opt.id);
    return; }
  const oef = e.target.closest("[data-opteditform]");
  if (oef){ e.preventDefault();
    const oid = oef.dataset.opteditform, fd = new FormData(oef), id = itemOf(oef);
    openOpt = null;
    setOptions(id, s=>{ const o = s.options.find(x=>x.id===oid); if(o){
      o.title = String(fd.get("title")||"").trim() || o.title; o.brand = String(fd.get("brand")||"").trim();
      o.price = parsePrice(fd.get("price")); o.pending = o.price==null;
      if (s.chosenId===oid) s.price = o.price; } return s; });
    return; }
  const f = e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  const id = f.dataset.form, fd = new FormData(f);
  const patch = {name:String(fd.get("name")).trim()||"Item", price:parsePrice(fd.get("price")),
    priority:fd.get("priority"), note:String(fd.get("note")||"").trim(), link:String(fd.get("link")||"").trim()};
  openEdit = null;
  write(()=>col.doc(id).update(patch), ()=>{ const it=items.find(i=>i.id===id); if(it) Object.assign(it,patch); });
});

/* ---------- Supabase ---------- */
const SUPABASE_URL = "https://ufbmhikchqhstcbhioib.supabase.co";
const SUPABASE_KEY = "sb_publishable_QGj4aoHhWZXbCUBep2tylA_a8NckDy7";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
let session = null, channel = null;

const fromRow = r => ({id:r.id, room:r.room, name:r.name, price:r.price==null?null:Number(r.price), priority:r.priority,
  note:r.note||"", link:r.link||"", done:!!r.done, options:Array.isArray(r.options)?r.options:[], chosenId:r.chosen_id||null, createdAt:Number(r.created_at)||0});
function toRow(d){
  const map = {chosenId:"chosen_id", createdAt:"created_at"}, out = {};
  for (const [k,v] of Object.entries(d)) if (k!=="id") out[map[k]||k] = v;
  return out;
}
async function check(p){ const {error} = await p; if (error) throw error; }

col = {
  add: data => check(sb.from("items").insert(toRow(data))).then(reload),
  doc: id => ({
    update: patch => check(sb.from("items").update(toRow(patch)).eq("id", id)),
    delete: () => check(sb.from("items").delete().eq("id", id))
  })
};
assets = {
  async upload(file){
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
    const path = `${session.user.id}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error} = await sb.storage.from("fotos").upload(path, file, {contentType:file.type||"image/jpeg", upsert:false});
    if (error) throw error;
    return {id:path, url:sb.storage.from("fotos").getPublicUrl(path).data.publicUrl};
  }
};

/* ---------- buscar foto e preço na loja (função "produto" no Supabase) ---------- */
const enriching = new Set(), triedEnrich = new Set();
let fnAvailable = true;
const KNOWN = {"omva3z4if": "https://a-static.mlcdn.com.br/470x352/geladeira-electrolux-cycle-defrost-260l-super-freezer-duplex-branca-dc35a/magazineluiza/013070601/02f3faa6d87b2a4161ea70d426e5f99e.jpg"};
async function enrich(itemId, optId, manual){
  const it = items.find(i=>i.id===itemId); const o = it && (it.options||[]).find(x=>x.id===optId);
  if (!o || enriching.has(optId) || (!manual && !fnAvailable)) return;
  triedEnrich.add(optId);
  enriching.add(optId); render();
  let info = null;
  try{
    const {data, error} = await sb.functions.invoke("produto", {body:{url:o.link}});
    if (error) throw error;
    info = data;
  }catch(e){ console.warn("produto:", e); fnAvailable = false;
    if (manual) alertMsg("Não consegui buscar os dados dessa loja. Toque na foto para enviar uma imagem e em Editar para pôr o preço."); }
  enriching.delete(optId);
  if (!info || info.error){ if (info && info.error && manual) alertMsg("Essa loja bloqueia a busca automática pelo app. Em até 1 hora a foto e o preço são completados, ou toque em Editar para pôr o preço agora."); render(); return; }
  const d = new Date(), seen = `preço visto em ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
  await setOptions(itemId, s=>{ const x = s.options.find(y=>y.id===optId); if (x){
      if (info.image && !x.photo) x.photo = info.image;
      if (info.title && (!x.fullTitle || x.fullTitle==="Produto")) x.fullTitle = info.title;
      if (info.title && (!x.title || x.title==="Produto")) x.title = info.title;
      if (info.brand && !x.brand) x.brand = info.brand;
      if (typeof info.price === "number" && info.price > 0){ x.price = info.price; x.priceNote = seen; x.pending = false; if (s.chosenId===optId) s.price = x.price; }
    } return s; });
}
function autoFill(){
  for (const it of items) for (const o of (it.options||[])){
    if (!o.photo && KNOWN[o.id] && !triedEnrich.has("k"+o.id)){ triedEnrich.add("k"+o.id);
      setOptions(it.id, s=>{ const x=s.options.find(y=>y.id===o.id); if(x && !x.photo) x.photo = KNOWN[o.id]; return s; }); continue; }
    if ((!o.photo || o.price==null) && !triedEnrich.has(o.id) && fnAvailable && (!NO_AUTO.test(o.link||"") ? true : !o.photo)) enrich(it.id, o.id);
  }
}

let reloadTimer = null;
async function reload(){
  if (!session) return;
  const {data, error} = await sb.from("items").select("*").order("created_at");
  if (error){ console.error(error);
    $("status").textContent = /relation|does not exist|schema cache/i.test(error.message||"")
      ? "O banco de dados ainda não foi configurado. Rode o script casa-nova-supabase.sql no Supabase."
      : "Não foi possível carregar a lista. Verifique a internet.";
    render(); return; }
  items = data.map(fromRow);
  const st = await sb.from("settings").select("budget").maybeSingle();
  if (!st.error && st.data && st.data.budget != null) budget = Number(st.data.budget);
  if (!items.length && await importSeed()) return reload();
  $("status").textContent = "Toque em um cômodo para ver e editar a lista.";
  render();
  autoFill();
}
const reloadSoon = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(reload, 250); };

async function importSeed(){
  try{
    const key = "casa-nova-seed-" + session.user.id;
    try{ if (localStorage.getItem(key)) return false; }catch(e){}
    const res = await fetch("seed.json", {cache:"no-store"}); if (!res.ok) return false;
    const rows = await res.json(); if (!rows.length) return false;
    const {error} = await sb.from("items").insert(rows);
    if (error) throw error;
    try{ localStorage.setItem(key, "1"); }catch(e){}
    return true;
  }catch(e){ console.error(e); return false; }
}

function subscribe(){
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("items-" + session.user.id)
    .on("postgres_changes", {event:"*", schema:"public", table:"items", filter:`user_id=eq.${session.user.id}`}, reloadSoon)
    .on("postgres_changes", {event:"*", schema:"public", table:"settings", filter:`user_id=eq.${session.user.id}`}, reloadSoon)
    .subscribe();
}

async function setSession(s){
  const changed = (s?.user?.id) !== (session?.user?.id);
  session = s;
  if (!session){ if (channel){ sb.removeChannel(channel); channel = null; } items = []; render(); return; }
  $("who").textContent = session.user.email || "";
  if (changed){ render(); await reload(); subscribe(); }
}

/* ---------- orçamento ---------- */
$("summary").addEventListener("click", e=>{
  if (e.target.closest("[data-budget-edit]")){ editingBudget = true; renderHome(); const i=$("budgetInput"); i && (i.focus(), i.select()); }

  if (e.target.id !== "budgetForm") return; e.preventDefault();
  const v = parsePrice($("budgetInput").value);
  if (v == null || v < 0){ $("budgetInput").focus(); return; }
  budget = v; editingBudget = false; renderHome();
  const {error} = await sb.from("settings").upsert({user_id: session.user.id, budget: v, updated_at: new Date().toISOString()});
  if (error){ console.error(error); $("status").textContent = "Não foi possível salvar o orçamento. Verifique a internet e tente de novo."; }
});

/* ---------- login ---------- */
const authMsg = (t, err) => { const m = $("authMsg"); m.textContent = t; m.classList.toggle("err", !!err); };
function authError(e){
  const m = (e && e.message) || "";
  if (/invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if (/not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos e tente entrar de novo.";
  if (/already registered|already exists/i.test(m)) return "Esse e-mail já tem conta. Toque em Entrar.";
  if (/password/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  return "Não foi possível entrar agora. Verifique a internet e tente de novo.";
}
$("authForm").addEventListener("submit", async e=>{
  e.preventDefault(); authMsg("Entrando…");
  const {data, error} = await sb.auth.signInWithPassword({email:$("authEmail").value.trim(), password:$("authPass").value});
  if (error) return authMsg(authError(error), true);
  authMsg(""); setSession(data.session);
});
$("btnSignup").addEventListener("click", async ()=>{
  const email = $("authEmail").value.trim(), password = $("authPass").value;
  if (!email || password.length < 6) return authMsg("Preencha o e-mail e uma senha com pelo menos 6 caracteres.", true);
  authMsg("Criando conta…");
  const {data, error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: location.origin + location.pathname}});
  if (error) return authMsg(authError(error), true);
  if (data.session){ authMsg(""); setSession(data.session); }
  else authMsg("Conta criada. Abra o e-mail de confirmação que enviamos, toque no link e depois volte aqui para entrar.");
});
$("btnLogout").addEventListener("click", async ()=>{ await sb.auth.signOut(); setSession(null); });

/* ---------- boot ---------- */
const start = location.hash.slice(1);
current = ROOMS.some(r=>r.id===start) ? start : null;
sb.auth.onAuthStateChange((_ev, s)=>{ setSession(s); });
sb.auth.getSession().then(({data})=>{ setSession(data.session); if (!data.session) render(); });
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) reloadSoon(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
